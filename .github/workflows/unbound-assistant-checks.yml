name: Unbound Assistant checks

on:
  push:
    paths:
      - "unbound-assistant/**"
      - ".github/workflows/unbound-assistant-checks.yml"
  pull_request:
    paths:
      - "unbound-assistant/**"
      - ".github/workflows/unbound-assistant-checks.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unbound-assistant
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install
      - name: Check server and browser JavaScript syntax
        run: npm run check
