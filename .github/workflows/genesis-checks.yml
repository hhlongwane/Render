name: GENESIS checks

on:
  push:
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-checks.yml"
  pull_request:
    paths:
      - "genesis/**"
      - ".github/workflows/genesis-checks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax and unit checks
        working-directory: genesis
        run: npm run check
