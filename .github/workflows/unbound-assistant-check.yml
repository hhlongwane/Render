name: Unbound Assistant checks

on:
  push:
    paths:
      - "unbound-assistant/**"
  pull_request:
    paths:
      - "unbound-assistant/**"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unbound-assistant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
